returns_path: data/processed/global_security_returns.csv
fx_report_path: data/processed/global_fx_normalization_report.csv
universe_paths:
  - data/universe/current_global_equity_universe.csv
output_dir: data/processed
selection:
  min_holdings: 25
  max_holdings: 100
  max_weight: 0.10
  random_state: 42
portfolio_constraints:
  long_only: true
  weight_sum: 1.0
  max_single_asset_weight: 0.10
  min_holdings: 25
  max_holdings: 100
  min_global_equity_weight: 0.50
  max_defensive_weight: 0.35
  max_crypto_weight: 0.10
  max_commodity_weight: 0.20
  max_region_weight: 0.35
  max_cluster_weight: 0.25
random_portfolios:
  n_portfolios: 10000
promotion_gate:
  random_percentile_threshold: 0.90
  volatility_relative_limit: 1.25
  max_drawdown_penalty: 0.05
  cvar_penalty: 0.05
  estimated_initial_turnover: 1.00
  transaction_cost_bps: 10.0
  max_turnover: 1.00
  max_transaction_cost_drag: 0.0025
