[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "quantverse"
version = "1.0.0"
description = "Multi-asset quantitative portfolio optimization and risk analytics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sercan" }]
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "pyarrow>=14.0.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
    "ruff>=0.5.0",
]
notebook = [
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "Lib",
    "Scripts",
    "share",
    "etc",
    "notebooks",
    "reports",
    "data",
    "src/project.egg-info",
]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "Lib",
    "Scripts",
    "share",
    "etc",
    "notebooks",
    "reports",
    "data",
    "output",
    "tmp",
    "src/project.egg-info",
    "src/quantverse.egg-info",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
